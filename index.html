<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제8회 서귀포시장배 수영대회</title>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #1f2937;
      margin-bottom: 20px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 16px;
    }
    button.btn-search {
      padding: 12px 20px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button.btn-search:hover {
      background-color: #1d4ed8;
    }
    .result-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      background-color: #fafafa;
    }
    .info-row {
      margin-bottom: 8px;
      font-size: 15px;
    }
    .btn-print {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color: #059669;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-print:hover {
      background-color: #047857;
    }
    .status-msg, .error-msg {
      text-align: center;
      padding: 15px;
      font-size: 16px;
    }
    .error-msg { color: #dc2626; }
    
    /* 인쇄 및 화면 상장 표시 영역 */
    #print-area {
      margin-top: 30px;
      text-align: center;
    }
    #certCanvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #ccc;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      #btnDoPrint {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏆 제8회 서귀포시장배 수영대회</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="이름을 입력하세요" onkeydown="if(event.key==='Enter') searchData()">
      <button class="btn-search" onclick="searchData()">검색</button>
    </div>
    <div id="result-box"></div>
  </div>

  <div id="print-area" style="display:none;">
    <canvas id="certCanvas"></canvas>
  </div>

<script>
  // 1. 구글 Apps Script 웹 앱 주소
  const API_URL = "https://script.google.com/macros/s/AKfycbwI57i6T9RfkaizJ_pmz6yyq6LHTpbKZnEpyrOBBMxuX1t4pvku4TA3o2KMnMjTjeJvBQ/exec";
  
  // 2. 상장 배경 이미지 주소 (구글 드라이브 이미지 연동용)
  const CERT_IMAGE_URL = "https://lh3.googleusercontent.com/d/1m9TLhOMDc3xFnG5Ley6e9dC30Pogeabu"; 

  async function searchData() {
    const inputName = document.getElementById('searchInput').value.trim();
    const resultBox = document.getElementById('result-box');

    if (!inputName) {
      alert('이름을 입력해 주세요.');
      return;
    }

    resultBox.innerHTML = '<div class="status-msg">🔍 조회 중입니다...</div>';

    try {
      const response = await fetch(API_URL);
      const data = await response.json();

     const matched = data.filter(item => {
  const nameVal = item["이름"] || item["성명"];
  // 입력한 이름(예: 탁윤)이 해당 셀 텍스트(예: 탁윤 박도건 김동준 강진혁)에 포함되어 있는지 확인
  return nameVal && nameVal.toString().includes(inputName);
});

      if (matched.length === 0) {
        resultBox.innerHTML = '<div class="error-msg">❌ 검색 결과가 없습니다. 이름을 확인해 주세요.</div>';
        return;
      }

      let html = '';
      matched.forEach((item) => {
        const name = item["이름"] || item["성명"] || "-";
        const org = item["소속"] || "-";
        const category = item["종목"] || "-";
        const rank = item["등위"] || item["순위"] || "-";
        const record = item["기록"] || "-";

        const itemJson = encodeURIComponent(JSON.stringify({ name, org, category, rank, record }));

        html += `
          <div class="result-card">
            <div class="info-row"><strong>성명:</strong> ${name} | <strong>소속:</strong> ${org}</div>
            <div class="info-row"><strong>종목:</strong> ${category} | <strong>등위:</strong> ${rank} | <strong>기록:</strong> ${record}</div>
            <button class="btn-print" onclick="generateAndShow('${itemJson}')">📜 상장 미리보기</button>
          </div>
        `;
      });

      resultBox.innerHTML = html;

    } catch (error) {
      console.error(error);
      resultBox.innerHTML = '<div class="error-msg">⚠️ 데이터를 불러오는 중 오류가 발생했습니다.</div>';
    }
  }

  function generateAndShow(itemJsonEncoded) {
    const item = JSON.parse(decodeURIComponent(itemJsonEncoded));
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    
    img.crossOrigin = "Anonymous";
    img.src = CERT_IMAGE_URL;

    img.onload = function() {
      canvas.width = img.width;
      canvas.height = img.height;

      // 1. 상장 배경 그리기
      ctx.drawImage(img, 0, 0);

     // 2. 글자 스타일 설정 (26px 기준)
      ctx.fillStyle = "#000000";
      ctx.font = "bold 20px 'Noto Sans KR', sans-serif"; 
      ctx.textAlign = "left";
      
      // 좌측 시작 X좌표 (상장 중앙-좌측 정렬 위치)
      const leftX = canvas.width * 0.22;   
      
      // 한 줄씩 위에서 아래로 차례대로 배치 (Y좌표)
      const line1Y = canvas.height * 0.30; // 종목
      const line2Y = canvas.height * 0.33; // 등위
      const line3Y = canvas.height * 0.36; // 기록
      const line4Y = canvas.height * 0.39; // 소속
      const line5Y = canvas.height * 0.42; // 이름 (4명 이름도 끝까지 다 들어감)

      // 5개 항목 세로 1열 출력
      ctx.fillText(`종    목 : ${item.category}`, leftX, line1Y);
      ctx.fillText(`등    위 : ${item.rank}`, leftX, line2Y);
      ctx.fillText(`기    록 : ${item.record}`, leftX, line3Y);
      ctx.fillText(`소    속 : ${item.org}`, leftX, line4Y);
      ctx.fillText(`이    름 : ${item.name}`, leftX, line5Y);

      // 3. 화면에 생성된 상장 보여주기
      const printArea = document.getElementById('print-area');
      printArea.style.display = 'block';
      
      // 기존 인쇄 버튼 삭제 후 재생성
      const oldBtn = document.getElementById('btnDoPrint');
      if(oldBtn) oldBtn.remove();

      const printBtn = document.createElement('button');
      printBtn.id = 'btnDoPrint';
      printBtn.innerText = '🖨️ 이 상장 인쇄 / PDF 저장하기';
      printBtn.style.cssText = 'margin: 20px auto; padding: 15px 30px; font-size: 18px; font-weight: bold; background-color: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; display: block;';
      printBtn.onclick = function() { window.print(); };

      printArea.appendChild(printBtn);

      // 상장 화면 위치로 스크롤 이동
      printArea.scrollIntoView({ behavior: 'smooth' });
    };

    img.onerror = function() {
      alert("상장 이미지를 불러올 수 없습니다. 이미지 주소를 확인해 주세요.");
    };
  }
</script>

</body>
</html>
