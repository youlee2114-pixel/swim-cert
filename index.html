<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026년 서귀포시수영연맹회장배 수영대회</title>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #1f2937;
      margin-bottom: 20px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 16px;
    }
    button.btn-search {
      padding: 12px 20px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button.btn-search:hover {
      background-color: #1d4ed8;
    }
    .result-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      background-color: #fafafa;
    }
    .info-row {
      margin-bottom: 8px;
      font-size: 15px;
    }
    .btn-print {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color: #059669;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-print:hover {
      background-color: #047857;
    }
    .status-msg, .error-msg {
      text-align: center;
      padding: 15px;
      font-size: 16px;
    }
    .error-msg { color: #dc2626; }
    
    /* 인쇄 및 화면 표시 영역 */
    #print-area {
      margin-top: 30px;
      text-align: center;
    }
    #certCanvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #ccc;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 style="font-size: 22px;">🏆 2026년 <br> 서귀포시수영연맹회장배 <br> 수영대회</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="이름을 입력하세요" onkeydown="if(event.key==='Enter') searchData()">
      <button class="btn-search" onclick="searchData()">검색</button>
    </div>
    <div id="result-box"></div>
  </div>

  <div id="print-area" style="display:none;">
    <canvas id="certCanvas"></canvas>
  </div>

<script>
  // 1. 구글 Apps Script 웹 앱 주소
  const API_URL = "https://script.google.com/macros/s/AKfycbzwq7hb31Atwo6trCncKY341U_y8qB98v6p10E6mQ13sCi9f7cRYfGzEiSIJuMm6qaMIA/exec";
  
  // 2. 배경 이미지 주소 (구글 드라이브 이미지 연동용)
  const CERT_IMAGE_URL = "https://lh3.googleusercontent.com/d/1QZVYxSmGWIvGUsxLOEJeSBjL0lDYfT-5"; 

  async function searchData() {
    const inputName = document.getElementById('searchInput').value.trim();
    const resultBox = document.getElementById('result-box');

    if (!inputName) {
      alert('이름을 입력해 주세요.');
      return;
    }

    resultBox.innerHTML = '<div class="status-msg">🔍 조회 중입니다...</div>';

    try {
      const response = await fetch(API_URL);
      const data = await response.json();

      const matched = data.filter(item => {
        const nameVal = item["이름"] || item["성명"];
        return nameVal && nameVal.toString().includes(inputName);
      });

      if (matched.length === 0) {
        resultBox.innerHTML = '<div class="error-msg">❌ 검색 결과가 없습니다. 이름을 확인해 주세요.</div>';
        return;
      }

      let html = '';
      matched.forEach((item) => {
        const name = item["이름"] || item["성명"] || "-";
        const org = item["소속"] || "-";
        const category = item["종목"] || "-";
        const record = item["기록"] || "-";
        const no = item["연번"] || item["번호"] || item["NO"] || item["no"] || item["No"] || "";

        // 등위 데이터는 제외하고 전달
        const itemJson = encodeURIComponent(JSON.stringify({ name, org, category, record, no }));

        html += `
          <div class="result-card">
            <div class="info-row"><strong>성명:</strong> ${name} | <strong>소속:</strong> ${org}</div>
            <div class="info-row"><strong>종목:</strong> ${category} | <strong>기록:</strong> ${record}</div>
            <button class="btn-print" onclick="generateAndShow('${itemJson}')">📜 미리보기</button>
          </div>
        `;
      });

      resultBox.innerHTML = html;

    } catch (error) {
      console.error(error);
      resultBox.innerHTML = '<div class="error-msg">⚠️ 데이터를 불러오는 중 오류가 발생했습니다.</div>';
    }
  }

  function generateAndShow(itemJsonEncoded) {
    const item = JSON.parse(decodeURIComponent(itemJsonEncoded));
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    
    img.crossOrigin = "Anonymous";
    img.src = CERT_IMAGE_URL;

    img.onload = function() {
      canvas.width = img.width;
      canvas.height = img.height;

      // 1. 배경 그리기
      ctx.drawImage(img, 0, 0);

      // 2. 글자 스타일 설정 (폰트 크기를 키우고 싶다면 24px 숫자를 조정하세요)
      ctx.fillStyle = "#000000";
      ctx.font = "bold 24px 'Noto Sans KR', sans-serif"; 
      ctx.textAlign = "left";
      
      const leftX = canvas.width * 0.22;   
      
      // 등위를 제외하고 4개 항목에 맞춰 Y좌표 간격 재정렬
      const line1Y = canvas.height * 0.30; // 종목
      const line2Y = canvas.height * 0.35; // 기록
      const line3Y = canvas.height * 0.40; // 소속
      const line4Y = canvas.height * 0.45; // 이름

      // 4개 항목 세로 1열 출력 (등위 삭제됨)
      ctx.fillText(`종    목 : ${item.category}`, leftX, line1Y);
      ctx.fillText(`기    록 : ${item.record}`, leftX, line2Y);
      ctx.fillText(`소    속 : ${item.org}`, leftX, line3Y);
      ctx.fillText(`이    름 : ${item.name}`, leftX, line4Y);

      // 3. 모바일 이미지 저장 지원 & 인쇄 버튼
      const printArea = document.getElementById('print-area');
      printArea.style.display = 'block';
      
      const oldBtn = document.getElementById('btnDoPrint');
      if(oldBtn) oldBtn.remove();
      const oldImg = document.getElementById('mobileCertImg');
      if(oldImg) oldImg.remove();

      const imgSrc = canvas.toDataURL('image/png');

      const certImg = document.createElement('img');
      certImg.id = 'mobileCertImg';
      certImg.src = imgSrc;
      certImg.style.cssText = 'display: block; max-width: 100%; height: auto; border: 1px solid #ccc; margin: 0 auto;';
      
      canvas.style.display = 'none';

      const printBtn = document.createElement('button');
      printBtn.id = 'btnDoPrint';
      printBtn.innerText = '🖨️ 인쇄 / PDF 저장하기';
      printBtn.style.cssText = 'margin: 20px auto; padding: 15px 30px; font-size: 18px; font-weight: bold; background-color: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; display: block;';
      
      // 새 창을 띄워 인쇄하는 방식 (빈 페이지 출력 방지)
      printBtn.onclick = function() {
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
          <html>
            <head>
              <title>기록증 인쇄</title>
              <style>
                body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
                img { max-width: 100%; height: auto; page-break-inside: avoid; }
              </style>
            </head>
            <body>
              <img src="${imgSrc}" onload="window.print(); window.close();" />
            </body>
          </html>
        `);
        printWindow.document.close();
      };

      printArea.appendChild(certImg);
      printArea.appendChild(printBtn);

      printArea.scrollIntoView({ behavior: 'smooth' });
    };

    img.onerror = function() {
      alert("이미지를 불러올 수 없습니다. 이미지 주소를 확인해 주세요.");
    };
  }
</script>

</body>
</html>
